<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 32 32" style="flex: none"><rect class="logo-bg" width="32" height="32" rx="8"></rect><rect x="7.5" y="8" width="5" height="16" rx="1.5" fill="#FFFFFF"></rect><rect x="13.5" y="8" width="5" height="11" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"></rect><rect x="19.5" y="8" width="5" height="7" rx="1.5" fill="#6E8FFF"></rect></svg>
        Tasks
      </div>
      <nav class="mainnav" aria-label="Main" id="mainnav">
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/projects" data-nav="projects">Projects</a>
      </nav>
      <button type="button" class="icon-btn" id="theme-btn" data-action="toggleTheme"></button>
      <button type="button" class="btn btn-primary" id="new-task-btn" data-action="newTask">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        New task
      </button>
    </div>
  </header>
  <main id="view"></main>
  <dialog id="dlg"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
