<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 32 32" style="flex: none"><rect class="logo-bg" width="32" height="32" rx="8"></rect><rect x="7.5" y="8" width="5" height="16" rx="1.5" fill="#FFFFFF"></rect><rect x="13.5" y="8" width="5" height="11" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"></rect><rect x="19.5" y="8" width="5" height="7" rx="1.5" fill="#6E8FFF"></rect></svg>
        Tasks
      </div>
      <nav class="mainnav" aria-label="Main" id="mainnav">
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/projects" data-nav="projects">Projects</a>
      </nav>
      <div class="header-tools">
        <button type="button" class="icon-btn" id="quick-btn" data-action="toggleQuick" aria-pressed="false" aria-label="Quick list" title="Quick list">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>
        </button>
        <button type="button" class="icon-btn" id="theme-btn" data-action="toggleTheme"></button>
        <a class="icon-btn" href="#/settings" data-nav="settings" aria-label="Settings" title="Settings">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </a>
      </div>
      <button type="button" class="btn btn-primary" id="new-task-btn" data-action="newTask">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        New task
      </button>
    </div>
  </header>
  <main id="view"></main>
  <aside id="quick" class="quick" aria-labelledby="quick-h" hidden></aside>
  <dialog id="dlg"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
