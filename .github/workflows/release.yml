# Builds Tasks.exe on a GitHub-hosted Windows machine.
#
# - Pushing a version tag (for example v0.1.0) builds the app, runs the tests
#   and publishes a GitHub Release with Tasks.exe attached.
# - "Run workflow" on the Actions tab builds a test copy without a release;
#   download it from the run's Artifacts section.
name: Build Tasks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build Tasks.exe
        run: wails build -platform windows/amd64

      - name: Keep a copy of the build
        uses: actions/upload-artifact@v7
        with:
          name: Tasks
          path: build/bin/Tasks.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/bin/Tasks.exe --title "Tasks ${{ github.ref_name }}" --generate-notes
